
services:

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:  
      - qdrant_storage:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:    admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    

  rag-api:
    build:
      context: ./

    container_name: rag-api

    ports:
      - "8000:8000"

    environment:
      - QDRANT_HOST=qdrant

    depends_on:
      - qdrant
    volumes:
      - /home/manji/ETB134-AIOPS-IntKnowAst/local-rag/backend/data:/app/data

  ollama:
    image: ollama/ollama

    container_name: ollama

    ports:
      - "11435:11434"

    volumes:
      - ollama_data:/root/.ollama


volumes:
  qdrant_storage:
  minio_storage:
  ollama_data: